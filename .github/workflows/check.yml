# This is a basic workflow to help you get started with Actions

name: Checks

# Controls when the workflow will run
on:
  # On main, run when anything the job builds, tests or lints changes
  push:
    branches: ['main']
    paths:
      - '.github/**'
      - 'packages/**'
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - 'typedoc.json'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - '.editorconfig'
      - '.npmrc'
      - '.browserslistrc'
      - '*.md'
  # No path filter on pull requests: `check` is a required status check,
  # so it has to report on every PR or the PR cannot merge
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "check"
  check:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Checkout all branches and tags
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.0.0'
      - name: Install dependencies
        run: | # Install and link dependencies
          npm i
      - name: Build # Build all packages
        run: npm run build
      - name: Test
        run: npm run test:ci
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/hybrid-compute
          flags: monorepo
          files: ./packages/**/coverage/cobertura-coverage.xml

  notify:
    name: Notify failed check
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: jayqi/failed-build-issue-action@v1.2
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          label-name: 'problems: build failed'
