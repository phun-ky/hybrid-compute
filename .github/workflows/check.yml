name: Checks

on:
  # On main, run when anything the job builds, tests or lints changes
  push:
    branches: ['main']
    paths:
      - '.github/**'
      - 'packages/**'
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - 'typedoc.json'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - '.prettierignore'
      - '.editorconfig'
      - '.npmrc'
      - '.browserslistrc'
      - '*.md'
      - '*.yml'
      - '.bestpractices.json'
      - 'vex.openvex.json'
  # No path filter on pull requests: `check` is a required status check,
  # so it has to report on every PR or the PR cannot merge
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read-only by default; jobs ask for what they need
permissions:
  contents: read

jobs:
  check:
    # Skip release commits pushed one by one by `npm run release`; packages
    # are only consistent with each other after the last one
    if:
      "${{ !startsWith(github.event.head_commit.message, 'chore: 🤖
      @hybrid-compute/') }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # TypeDoc reads git for source links
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check sibling ranges # Every package's range for a sibling must match its local version
        run: npm run check:sibling-ranges
      - name: Check best practices answers # Every linked file, page and heading must exist
        run: npm run check:bestpractices
      - name: Build
        run: npm run build
      - name: Check the packages # Pack, install and import them as npm would publish them
        run: npm run check:pack
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type-check, tests included # After build: packages import each other's dist types
        run: npm run typecheck
      - name: Check API docs # TypeDoc errors and warnings (such as broken {@link}s) fail the build
        run: npm run docs:check
      - name: Test
        run: npm run test:ci
      - name: Test the release scripts # Version decisions, without git or npm
        run: npm run test:scripts
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/hybrid-compute
          flags: monorepo
          files: ./packages/**/coverage/cobertura-coverage.xml

  notify:
    name: Notify failed check
    needs: check
    # Only for main; a failing pull request already shows its failed check
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
