# OpenSSF Scorecard: scores the repository's security practices and publishes
# the result, https://scorecard.dev/viewer/?uri=github.com/phun-ky/hybrid-compute
#
# Actions are pinned to commit SHAs (Scorecard checks for this); the comment on
# each line is the release the SHA belongs to.

name: Scorecard

on:
  # Re-score when branch protection changes, weekly, and on every push to main
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'
  push:
    branches: ['main']
  workflow_dispatch:

# Read-only by default; the job asks for exactly what it needs
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      # Upload the results to GitHub's code scanning dashboard
      security-events: write
      # Publish the results to the public Scorecard API and badge
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
