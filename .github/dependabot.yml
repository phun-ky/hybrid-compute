version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Major updates are not grouped, so each one gets its own PR to test and merge
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Keep @types/node on the Node major used by CI (24)
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # Stay on TypeScript 6 until we choose to move to 7
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    schedule:
      interval: 'weekly'
    # Only propose versions published at least 14 days ago: a compromised
    # release is usually caught within days. Security updates still open at once
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct
      - dependency-type: production

  # Actions are pinned to commit SHAs; this keeps the pins and their version
  # comments up to date
  - package-ecosystem: 'github-actions'
    directory: '/'
    # Majors are not grouped, as for npm: one blocked major must not hold back
    # the others
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    # Same cooldown as npm: a compromised release is usually caught within
    # days. Security updates still open at once
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'ci: 🎡 '
